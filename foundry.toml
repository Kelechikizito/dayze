[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]   
solc_version = "0.8.25"
evm_version = "cancun"
auto_detect_remappings = false

# The CoFHE mock coprocessor contracts exceed the EIP-170 24KB limit. So do test
# contracts: CofheTest alone is ~76KB and each CofheClient adds ~25KB. None of
# them go to a live chain, so the limit is raised locally. Check real contracts
# against 24KB with `forge build --sizes`.
code_size_limit = 300000

# Required by CoFHE: without isolate, encrypted values can be used across calls
# without the permission checks that a production chain enforces, so tests pass
# locally and fail on Arbitrum Sepolia.
isolate = true

# The deploy script writes deployments/<chainId>.json; fork tests read it.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_mainnet = "${ARBITRUM_MAINNET_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

# One Etherscan V2 key verifies on Arbiscan and Basescan (stored as ARBISCAN_API_KEY).
[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
base_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 84532 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
